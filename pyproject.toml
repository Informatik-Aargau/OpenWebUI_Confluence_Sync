[project]
name = "confluence-openwebui-sync"
version = "0.1.0"
description = "Synchronize Confluence Data Center pages to OpenWebUI Knowledge Bases"
requires-python = ">=3.12"
dependencies = [
    "docling>=2.31",
    "httpx>=0.27",
    "markdownify>=0.14",
    "psycopg2-binary>=2.9",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
]

[project.scripts]
confluence-sync = "src.main:main"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (e.g. docling engine)",
]
