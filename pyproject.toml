[project]
name = "confluence-openwebui-sync"
version = "0.1.0"
description = "Synchronize Confluence Data Center pages to OpenWebUI Knowledge Bases"
requires-python = ">=3.12"
dependencies = [
    "docling>=2.31",
    "httpx>=0.27",
    "psycopg2-binary>=2.9",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
]

[project.scripts]
confluence-sync = "src.main:main"
