# Template — populate values via sealed-secrets or your secret management tool.
apiVersion: v1
kind: Secret
metadata:
  name: confluence-sync-secrets
  namespace: confluence-sync
type: Opaque
stringData:
  CONFLUENCE_BASE_URL: "https://confluence.ag.ch"
  CONFLUENCE_PAT: "<your-pat>"
  OPENWEBUI_BASE_URL: "https://gpt-stage.ag.ch"
  OPENWEBUI_API_KEY: "<your-api-key>"
  DATABASE_URL: "postgresql://user:password@host:5432/dbname"
