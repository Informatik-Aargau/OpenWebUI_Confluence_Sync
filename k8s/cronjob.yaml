apiVersion: batch/v1
kind: CronJob
metadata:
  name: confluence-sync
  namespace: ${K8S_NAMESPACE}
spec:
  schedule: "${CRON_SCHEDULE}"  # Daily at 02:00
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          imagePullSecrets:
            - name: gitlab-aargaugpt-kpi-registry-${CI_COMMIT_BRANCH}
          containers:
            - name: confluence-sync
              image: ${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA}
              # Default entrypoint runs incremental sync.
              # For a full sync, override with: ["python", "-m", "src.main", "--full"]
              envFrom:
                - secretRef:
                    name: aargaugpt-sync-env-${CI_COMMIT_BRANCH}
                - configMapRef:
                    name: confluence-sync-config
              resources:
                requests:
                  memory: "128Mi"
                  cpu: "100m"
                limits:
                  memory: "512Mi"
                  cpu: "500m"
